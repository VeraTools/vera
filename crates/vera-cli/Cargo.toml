[package]
publish.workspace = true
name = "vera-cli"
description = "CLI interface for Vera code indexing and retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "vera"
path = "src/main.rs"

[dependencies]
vera-core = { workspace = true }
vera-mcp = { path = "../vera-mcp" }
vera-serve = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = "1"
tokio = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cliclack = "0.5"
console = "0.16"
dirs = "6.0.0"

[target.'cfg(windows)'.dependencies]
# Only the run-time symbol lookup for the Direct3D 12 probe in `setup`; the
# d3d12.dll export itself is declared locally so no Direct3D feature is needed.
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
