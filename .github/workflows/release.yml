name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      # Runner sizes are tuned so every target finishes near the macOS
      # baseline (~160s on 6vcpu, the smallest macOS label). Baselines measured
      # on 2vcpu at v1.0.1: arm 856s, windows 749s, musl 633s, gnu 554s.
      # Observed scaling: gnu compiles in 172s on 8vcpu (measured, warm
      # sccache); 16vcpu estimated ~4-4.5x over 2vcpu. Resulting band is
      # roughly 2.7-3.5 min per target; nothing is sized to beat the macOS
      # floor, since the release waits for it anyway.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: blacksmith-8vcpu-ubuntu-2404
            archive: tar.gz
            zig: true
            glibc: "2.28"

          - target: x86_64-unknown-linux-musl
            os: blacksmith-16vcpu-ubuntu-2404
            archive: tar.gz
            zig: true

          - target: aarch64-unknown-linux-gnu
            os: blacksmith-16vcpu-ubuntu-2404-arm
            archive: tar.gz
            zig: true
            glibc: "2.28"

          # Blacksmith macOS runners are Apple Silicon; x86_64-apple-darwin is cross-compiled via the rust target.
          - target: x86_64-apple-darwin
            os: blacksmith-6vcpu-macos-15
            archive: tar.gz

          - target: aarch64-apple-darwin
            os: blacksmith-6vcpu-macos-15
            archive: tar.gz

          - target: x86_64-pc-windows-msvc
            os: blacksmith-16vcpu-windows-2025
            archive: zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$OSTYPE" == darwin* ]]; then
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          else
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          fi
          cargo update --workspace

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Download vendored grammars
        shell: bash
        run: bash scripts/bootstrap-vendored-grammars.sh

      # Linux targets build through zig's C/C++ toolchain so the glibc binaries
      # link against an old glibc (portable to Ubuntu 20.04, Debian 10, RHEL 8)
      # and the musl binary gets a real musl C++ runtime for the C++ tree-sitter
      # scanners instead of the host glibc libstdc++.
      - name: Install cargo-zigbuild
        if: matrix.zig
        shell: bash
        run: |
          # cargo-zigbuild locates zig through `python3 -m ziglang`, so the
          # binary and its ziglang dependency must be importable by the same
          # interpreter. pipx hides ziglang inside an isolated venv whose
          # python3 is never probed ("Failed to find zig"), and the pip
          # --user fallback trips PEP 668 on Ubuntu 24.04. Install both into
          # one venv, put it on PATH, and pin the interpreter explicitly.
          VENV="$HOME/.cargo-zigbuild-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q cargo-zigbuild
          echo "$VENV/bin" >> "$GITHUB_PATH"
          echo "CARGO_ZIGBUILD_PYTHON_PATH=$VENV/bin/python" >> "$GITHUB_ENV"
          # Fail fast in this step if zig is unreachable, not at build time.
          "$VENV/bin/python" -m ziglang version
          PATH="$VENV/bin:$PATH" cargo zigbuild --help >/dev/null
          # sqlite-vec uses BSD u_int8_t/u_int16_t/u_int64_t types unavailable in musl.
          echo "CFLAGS_x86_64_unknown_linux_musl=-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t" >> "$GITHUB_ENV"

      - name: Set MSVC CRT flags
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CFLAGS=/MD" >> "$GITHUB_ENV"
          echo "CXXFLAGS=/MD" >> "$GITHUB_ENV"

      - name: Build (zig)
        if: matrix.zig
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          if [[ -n "${{ matrix.glibc }}" ]]; then TARGET="${TARGET}.${{ matrix.glibc }}"; fi
          cargo zigbuild --locked --release --target "$TARGET" -p vera-cli

      - name: Build (native)
        if: ${{ !matrix.zig }}
        run: cargo build --locked --release --target ${{ matrix.target }} -p vera-cli

      - name: Check Linux binary portability
        if: matrix.zig
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/vera"
          file "$BIN"
          if [[ -n "${{ matrix.glibc }}" ]]; then
            MAX=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
            echo "highest glibc symbol version: $MAX"
            [[ "$(printf '%s\n' "${MAX#GLIBC_}" "${{ matrix.glibc }}" | sort -V | tail -1)" == "${{ matrix.glibc }}" ]]
          else
            file "$BIN" | grep -q 'static'
          fi

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_NAME="vera-${{ matrix.target }}"
          mkdir -p "staging/${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/vera" "staging/${ARCHIVE_NAME}/"
          cd staging
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          echo "ARCHIVE=${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          ARCHIVE_NAME="vera-${{ matrix.target }}"
          mkdir -p "staging/${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/vera.exe" "staging/${ARCHIVE_NAME}/"
          cd staging
          7z a "${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          echo "ARCHIVE=${ARCHIVE_NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: staging/vera-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" packages/npm-cli/package.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" packages/python-cli/pyproject.toml

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate release manifest
        shell: bash
        run: |
          python3 scripts/generate_release_manifest.py release "${GITHUB_REF_NAME}" "${{ github.repository }}"

      - name: Determine if latest release
        id: latest
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          HIGHEST=$(git tag --sort=-v:refname | head -1)
          if [ "$TAG" = "$HIGHEST" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Find the previous tag by version order (the one just below current)
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          # If grep matched only the tag itself, there's no previous
          if [ "$PREV_TAG" = "$TAG" ]; then PREV_TAG=""; fi
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..${TAG}"
          fi

          BODY=""
          # Collect commits by type
          for type_label in "feat:Features" "fix:Bug Fixes" "perf:Performance"; do
            prefix="${type_label%%:*}"
            heading="${type_label##*:}"
            commits=$(git log --oneline "$RANGE" --grep="^${prefix}" --format="- %s" 2>/dev/null | sed "s/^- ${prefix}(\([^)]*\)): /- **\1:** /;s/^- ${prefix}: /- /")
            if [ -n "$commits" ]; then
              BODY="${BODY}### ${heading}\n${commits}\n\n"
            fi
          done

          # Other notable commits (chore, refactor, docs — skip pure docs-only releases)
          other=$(git log --oneline "$RANGE" --format="%s" 2>/dev/null | grep -vE "^(feat|fix|perf)" | grep -E "^(refactor|chore|build|ci)" | sed 's/^\([a-z]*\)(\([^)]*\)): /- **\2:** /;s/^\([a-z]*\): /- /' || true)
          if [ -n "$other" ]; then
            BODY="${BODY}### Other Changes\n${other}\n\n"
          fi

          if [ -z "$BODY" ]; then
            BODY="Maintenance release — see commit history for details.\n"
          fi

          BODY="${BODY}**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"

          # Write to file for the release step
          mkdir -p release
          echo -e "$BODY" > release/CHANGELOG.md
          cat release/CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/release-manifest.json
          body_path: release/CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ steps.latest.outputs.is_latest }}

      - name: Set up Node.js
        if: ${{ env.NPM_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@vera-ai'

      - name: Publish npm wrapper
        if: ${{ env.NPM_TOKEN != '' }}
        shell: bash
        working-directory: packages/npm-cli
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish --access public

      - name: Set up Python
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish Python wrapper
        if: ${{ env.PYPI_API_TOKEN != '' }}
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          python -m build packages/python-cli
          python -m twine upload --non-interactive packages/python-cli/dist/*

  # Images package the exact binary published in the release assets, so no
  # separate compile is needed. `needs: build` waits for the whole build
  # matrix, but runner sizes are tuned so all targets finish within the same
  # ~3 min band, so the extra wait over a dedicated linux-gnu job is marginal.
  docker:
    name: Docker (${{ matrix.variant }})
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Scoped per variant: blocks concurrent publishes of the same mutable
    # tag across workflows while letting cpu/cuda/rocm/openvino publish in parallel.
    concurrency:
      group: docker-image-publication-${{ matrix.variant }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: docker/Dockerfile.cpu
            tag_suffix: cpu
          - variant: cuda
            dockerfile: docker/Dockerfile.cuda
            tag_suffix: cuda
          - variant: rocm
            dockerfile: docker/Dockerfile.rocm
            tag_suffix: rocm
          - variant: openvino
            dockerfile: docker/Dockerfile.openvino
            tag_suffix: openvino

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: artifacts

      - name: Stage binary
        run: |
          mkdir -p dist
          tar xzf artifacts/vera-x86_64-unknown-linux-gnu.tar.gz -C artifacts
          cp artifacts/vera-x86_64-unknown-linux-gnu/vera dist/vera
          chmod +x dist/vera

      - name: Lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ephemeral builder: no persistent layer cache. Blacksmith sticky
      # builder disks are billed per GB-month, and the v1 sticky rocm builder
      # held a corrupted layer cache that failed the v1.0.1 publish with
      # digest mismatches. The runner's own docker daemon remains the
      # fallback below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: publish
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ matrix.tag_suffix }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ steps.version.outputs.version }}-${{ matrix.tag_suffix }}

      # Fallback when the buildkit path fails (seen: "unexpected commit digest"
      # on a rocm base layer whose computed digest varied per run, i.e. fetch
      # corruption in the registry-mirror pull path, not a poisoned cache).
      # The retry prunes the builder, then builds via the runner's own docker
      # daemon, an ephemeral store with a separate registry fetch path.
      # Healthy builds never pay for this.
      - name: Repair builder cache
        if: steps.publish.outcome == 'failure'
        # Best-effort: a prune failure must not block the daemon retry below.
        run: docker buildx prune -af || true

      - name: Build and push (retry via docker daemon)
        if: steps.publish.outcome == 'failure'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME_LC}"
          docker build -f "$DOCKERFILE" -t "$IMAGE:$TAG_SUFFIX" -t "$IMAGE:$VERSION-$TAG_SUFFIX" .
          docker push "$IMAGE:$TAG_SUFFIX"
          docker push "$IMAGE:$VERSION-$TAG_SUFFIX"
