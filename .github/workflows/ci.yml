name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# CI runs on every push and PR, so it uses stock GitHub-hosted runners (free
# for public repos) and never draws down Blacksmith minutes; those are
# reserved for the tag-triggered release workflow. Stock runners are 4-vcpu
# against Blacksmith's 8/16-vcpu labels, so timeouts are padded for the
# slower cold builds.
jobs:
  validate:
    name: Validate (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Check lockfile consistency
        shell: bash
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Download vendored grammars
        shell: bash
        run: bash scripts/bootstrap-vendored-grammars.sh

      - name: Install cargo tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,cargo-audit@0.22.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Check all targets
        run: cargo check --locked --workspace --all-targets

      - name: Check public Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: Check licenses and advisories
        run: cargo deny --locked check

      - name: Check unused dependencies
        run: cargo machete

      - name: Audit vulnerabilities
        run: cargo audit

  msrv:
    name: MSRV Check (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain (1.88)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.88"

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Check lockfile consistency
        shell: bash
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Download vendored grammars
        shell: bash
        run: bash scripts/bootstrap-vendored-grammars.sh

      - name: Check compilation against MSRV
        run: cargo check --locked --workspace --all-targets

  windows-probe:
    name: Windows D3D12 probe (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Set MSVC CRT flags
        shell: bash
        run: |
          echo "CFLAGS=/MD" >> "$GITHUB_ENV"
          echo "CXXFLAGS=/MD" >> "$GITHUB_ENV"

      - name: Check lockfile consistency
        shell: bash
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Download vendored grammars
        shell: bash
        run: bash scripts/bootstrap-vendored-grammars.sh

      # Executes has_directx12_adapter against the runner's real d3d12.dll and
      # prints the raw HRESULT, so the log is field evidence for #248.
      - name: Run setup probe tests on real Windows
        run: cargo test --locked -p vera-cli --bin vera setup -- --nocapture

      - name: Check Windows safety and lints
        run: cargo clippy --locked -p vera-cli -p vera-core --all-targets -- -D warnings

      - name: Check cross-process index locks on Windows
        run: cargo test --locked -p vera-core indexing::lock -- --nocapture

  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'
          package-manager-cache: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: actionlint@1.7.12,shellcheck@0.11.0
      - run: python -m pip install ruff==0.16.9
      - name: Check workflows and shell scripts
        run: |
          actionlint
          shellcheck eval/*.sh scripts/*.sh
      - name: Check Python
        run: ruff check --select E4,E7,E9,F benchmarks eval scripts packages/python-cli
      - name: Check npm JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files 'packages/npm-cli/*.js' 'packages/npm-cli/**/*.js')

  release-tools:
    name: Release tooling fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/tests -v

  wrappers:
    name: Wrapper runtime floors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.9'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'
          package-manager-cache: false
      - run: node --test packages/npm-cli/test/wrapper.test.js
      - run: python -m unittest discover -s packages/python-cli/tests -v
