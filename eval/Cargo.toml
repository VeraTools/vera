[package]
publish.workspace = true
name = "vera-eval"
version = "0.1.0"
edition = "2024"
description = "Evaluation harness for Vera code indexing & retrieval"
license = "MIT"

[[bin]]
name = "vera-eval"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
tokio.workspace = true
vera-core.workspace = true

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.39", features = ["bundled"] }

[lints]
workspace = true
